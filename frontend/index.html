<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NetOps 运维管家 · 纳西妲</title>
<link rel="icon" type="image/webp" href="/assets/nahida.webp">
<style>
  :root{
    --bg:#F4F8EE; --panel:#FFFFFF; --panel2:#EAF3DF; --line:#D4E4C2;
    --ink:#2D4A2D; --sub:#6B8A6B; --accent:#7CB342; --accent2:#558B2F;
    --user:#558B2F; --err:#E57373;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'PingFang SC','Microsoft YaHei','Segoe UI',Arial,sans-serif;
    background:linear-gradient(160deg,#F4F8EE 0%,#E8F1DA 50%,#F4F8EE 100%);
    color:var(--ink);display:flex;flex-direction:column;height:100vh;
  }
  header{
    padding:12px 20px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    background:rgba(255,255,255,.85);backdrop-filter:blur(4px);
  }
  header .brand{display:flex;align-items:center;gap:10px;}
  .logo{width:38px;height:38px;border-radius:11px;background:#fff;border:2px solid var(--accent);
    display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .logo img{width:100%;height:100%;object-fit:cover;}
  header h1{font-size:16px;font-weight:700;}
  header .tag{font-size:12px;color:var(--sub);}
  #status{font-size:12px;color:var(--sub);background:var(--panel2);border:1px solid var(--line);
    padding:4px 12px;border-radius:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  #status .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;}
  #status .mock{color:var(--accent);font-weight:600;}
  main{flex:1;overflow-y:auto;padding:20px 16px;max-width:1040px;width:100%;margin:0 auto;}
  #chat{max-width:860px;margin:0 auto;}
  .msg{display:flex;gap:10px;margin-bottom:16px;align-items:flex-start;}
  .avatar{flex:0 0 34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    font-size:14px;font-weight:700;color:#fff;}
  .msg.user .avatar{background:var(--user);}
  .msg.bot .avatar{background:linear-gradient(135deg,var(--accent),var(--accent2));}
  .bubble{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;font-size:14px;line-height:1.75;white-space:pre-wrap;word-break:break-word;}
  .msg.user .bubble{background:rgba(14,116,144,.18);border-color:rgba(14,116,144,.4);}
  .bubble.err{border-color:rgba(229,115,115,.5);}
  .bubble.tracebox{background:rgba(53,195,216,.06);border-color:rgba(53,195,216,.28);padding:10px 12px;}
  .tracetitle{font-size:12px;color:var(--accent);font-weight:600;margin-bottom:6px;}
  .traceline{font-size:12px;color:var(--sub);line-height:1.6;padding:2px 0;border-bottom:1px dashed rgba(53,195,216,.12);white-space:pre-wrap;word-break:break-all;}
  .traceline:last-child{border-bottom:none;}
  .traceline .tk{color:var(--accent);font-weight:600;}
  .traceline .ok{color:#7BD88F;} .traceline .no{color:var(--err);}
  .cursor{display:inline-block;width:8px;height:16px;background:var(--accent);vertical-align:-2px;animation:blink 1s steps(2) infinite;margin-left:2px;}
  @keyframes blink{50%{opacity:0;}}
  footer{padding:14px 16px;border-top:1px solid var(--line);background:rgba(22,43,51,.9);}
  .inputbar{max-width:860px;margin:0 auto;display:flex;gap:10px;align-items:flex-end;}
  textarea{flex:1;resize:none;background:var(--panel2);color:var(--ink);border:1px solid var(--line);
    border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.5;min-height:48px;max-height:160px;
    font-family:inherit;outline:none;}
  textarea:focus{border-color:var(--accent);}
  button{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;
    border-radius:12px;padding:0 22px;height:48px;font-size:15px;font-weight:700;cursor:pointer;transition:opacity .15s;}
  button:hover{opacity:.9;} button:disabled{opacity:.4;cursor:not-allowed;}
  .hint{max-width:860px;margin:6px auto 0;font-size:12px;color:var(--sub);text-align:center;}
  .placeholder{text-align:center;color:var(--sub);margin-top:14vh;font-size:14px;}
  .placeholder .big{font-size:18px;color:var(--accent);margin-bottom:10px;}
  .chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px;}
  .chip{font-size:12px;color:var(--sub);background:var(--panel2);border:1px solid var(--line);
    border-radius:14px;padding:5px 12px;cursor:pointer;}
  .chip:hover{border-color:var(--accent);color:var(--ink);}
  #simbar{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--sub);flex-wrap:wrap;}
  #simbar select{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:10px;
    padding:4px 8px;font-size:12px;outline:none;cursor:pointer;}
  #simbar select:focus{border-color:var(--accent);}
  #simbar .tip{color:var(--sub);font-size:11px;}
  #authbar{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--sub);flex-wrap:wrap;}
  #authbar input{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:10px;
    padding:5px 10px;font-size:12px;width:150px;outline:none;}
  #authbar input:focus{border-color:var(--accent);}
  #authbar button{height:auto;padding:5px 14px;font-size:12px;border-radius:10px;}
  #rolebadge{font-size:11px;padding:3px 10px;border-radius:12px;border:1px solid var(--line);color:var(--sub);}
  #rolebadge.admin{color:#7BD88F;border-color:rgba(123,216,143,.4);}
  #rolebadge.operator{color:var(--accent);border-color:rgba(53,195,216,.4);}
  #rolebadge.viewer{color:#F4B393;border-color:rgba(244,179,147,.4);}
  /* ---- 导航 tab（对话 / FRR 真实拓扑） ---- */
  .navbar{display:flex;gap:6px;margin-right:8px;flex-wrap:wrap;}
  .navtab{padding:6px 14px;font-size:13px;border:1px solid var(--line);border-radius:10px;cursor:pointer;
    color:var(--sub);background:var(--panel2);transition:all .15s;}
  .navtab:hover{border-color:var(--accent);color:var(--ink);}
  .navtab.active{color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;font-weight:600;}
  /* ---- 分栏布局（默认：左会话栏 + 对话 + 拓扑 并排） ---- */
  body{display:flex;flex-direction:column;height:100vh;overflow:hidden;}
  #main{display:flex;flex:1;overflow:hidden;}
  /* 会话侧栏 */
  #sidebar{width:230px;min-width:230px;background:var(--panel2);border-right:1px solid var(--line);
    display:flex;flex-direction:column;overflow:hidden;}
  #sidebar .sb-head{padding:12px 12px 8px;display:flex;justify-content:space-between;align-items:center;}
  #sidebar .sb-head h3{font-size:13px;font-weight:700;}
  #sidebar .sb-new{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;
    border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer;}
  #sidebar .sb-list{flex:1;overflow-y:auto;padding:4px 8px;}
  .sb-item{padding:8px 10px;border-radius:8px;font-size:12px;color:var(--sub);cursor:pointer;
    margin-bottom:2px;display:flex;align-items:center;gap:4px;flex-wrap:wrap;}
  .sb-item:hover{background:rgba(124,179,66,.12);color:var(--ink);}
  .sb-item.active{background:rgba(124,179,66,.2);color:var(--ink);font-weight:600;}
  .sb-del{width:18px;height:18px;line-height:16px;text-align:center;border-radius:50%;
    font-size:14px;color:var(--sub);flex-shrink:0;}
  .sb-del:hover{background:#E57373;color:#fff;}
  /* 中间对话列 */
  #chat{flex:55 1 0;min-width:0;max-width:none;margin:0;display:flex;flex-direction:column;
    overflow-y:auto;overflow-x:hidden;}
  #chat .msg-list-wrap{flex:1;overflow-y:auto;}
  /* 右侧拓扑列 */
  #topo{flex:45 1 0;min-width:0;display:block;padding:16px 14px;overflow-y:auto;border-left:1px solid var(--line);}
  .topo-wrap{max-width:none;}
  /* 窄屏（<1280px）自动单栏：仅对话 */
  @media (max-width:1280px){
    body.layout-split #topo{display:none;}
    body.layout-split #chat{flex:1;}
  }
  /* 单栏模式 */
  body.layout-chat #sidebar, body.layout-chat #topo{display:none;}
  body.layout-topo #sidebar, body.layout-topo #chat{display:none;}
  body.layout-topo #main{display:block;}
  body.layout-topo #topo{border-left:none;}
  /* ---- FRR 真实拓扑页 ---- */
  .topo-wrap{max-width:980px;margin:0 auto;}
  .topo-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .topo-head h2{font-size:16px;font-weight:700;}
  .topo-head .sub{font-size:12px;color:var(--sub);}
  .topo-actions{display:flex;gap:8px;align-items:center;}
  .topo-actions button{height:auto;padding:6px 16px;font-size:12px;border-radius:10px;}
  .topo-actions .autorefresh{font-size:11px;color:var(--sub);display:flex;align-items:center;gap:4px;}
  .topo-banner{background:rgba(244,179,147,.1);border:1px solid rgba(244,179,147,.4);color:#F4B393;
    border-radius:12px;padding:12px 14px;font-size:13px;margin-bottom:14px;}
  #topo-svg-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;
    margin-bottom:14px;overflow-x:auto;}
  #topo-svg-box svg{width:100%;min-width:640px;height:auto;display:block;}
  .node-box{fill:var(--panel2);stroke:var(--line);stroke-width:1.5;}
  .node-box.ok{stroke:#52C41A;} .node-box.bad{stroke:#EA6668;} .node-box.warn{stroke:#FAAD14;} .node-box.unk{stroke:var(--line);}
  .node-fault{fill:#FAAD14;font-size:11px;font-weight:700;}
  .node-title{fill:#E8F1F4;font-size:14px;font-weight:700;}
  .node-sub{fill:#9FB4BD;font-size:11px;}
  .node-role{fill:#35C3D8;font-size:11px;}
  .link-line{stroke:#9FB4BD;stroke-width:2;stroke-dasharray:6 4;}
  .link-line.ok{stroke:#52C41A;stroke-dasharray:none;}
  .link-line.bad{stroke:#EA6668;stroke-width:3;}
  .link-label{fill:#9FB4BD;font-size:11px;}
  .link-label.bad{fill:#EA6668;font-weight:700;}
  .topo-cards{display:flex;gap:12px;flex-wrap:wrap;}
  .dev-card{flex:1 1 300px;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;}
  .dev-card h3{font-size:13px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:8px;}
  .dev-card h3 .st{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .dev-card .st.ok{background:#52C41A;} .dev-card .st.bad{background:#EA6668;} .dev-card .st.unk{background:#9FB4BD;}
  .dev-card .meta{font-size:11px;color:var(--sub);margin-bottom:8px;}
  .dev-card table{width:100%;border-collapse:collapse;font-size:11px;margin-top:6px;}
  .dev-card th,.dev-card td{text-align:left;padding:3px 6px;border-bottom:1px solid rgba(42,70,82,.6);}
  .dev-card th{color:var(--accent);font-weight:600;}
  .dev-card td{color:var(--ink);font-family:Consolas,Menlo,monospace;font-size:10.5px;word-break:break-all;}
  .dev-card .sect{font-size:11px;color:var(--accent);font-weight:600;margin-top:8px;}
  .dev-card pre{white-space:pre-wrap;word-break:break-all;font-size:10px;color:var(--sub);line-height:1.5;
    max-height:150px;overflow-y:auto;background:var(--panel2);border-radius:8px;padding:8px;margin-top:4px;}
  .topo-hint{font-size:11px;color:var(--sub);text-align:center;margin-top:10px;}
  .t-green{color:#7BD88F;} .t-red{color:#EA6668;} .t-dim{color:#9FB4BD;}
  /* ---- 事件时间线 ---- */
  .tl-box{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;}
  .tl-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .tl-head b{font-size:13px;color:var(--ink);}
  .tl-head span{font-size:10.5px;color:var(--sub);}
  .tl-list{max-height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:2px;}
  .tl-item{display:flex;gap:8px;align-items:flex-start;font-size:11px;padding:4px 0;border-bottom:1px dashed rgba(42,70,82,.5);}
  .tl-item:last-child{border-bottom:none;}
  .tl-time{flex:0 0 128px;color:var(--sub);font-family:Consolas,Menlo,monospace;font-size:10px;padding-top:1px;}
  .tl-badge{flex:0 0 52px;text-align:center;font-size:10px;padding:1px 4px;border-radius:6px;color:#fff;}
  .tl-detail{flex:1;color:var(--ink);word-break:break-all;line-height:1.4;}
  .tl-actor{color:var(--accent);font-weight:600;}
  .b-chat{background:#5B8DEF;} .b-tool{background:#3FA66A;} .b-frr{background:#E08E45;}
  .b-scn{background:#9B6FD6;} .b-alert{background:#EA6668;} .b-other{background:#6B7C86;}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo"><img src="/assets/nahida.webp" alt="NetOps"></div>
    <div>
      <h1>NetOps 运维管家</h1>
      <div class="tag">AI Agent 驱动的网络运维助手 · 智谱 GLM</div>
    </div>
  </div>
  <nav class="navbar">
    <span class="navtab active" data-layout="split">分栏</span>
    <span class="navtab" data-layout="chat">仅对话</span>
    <span class="navtab" data-layout="topo">仅拓扑</span>
  </nav>
  <div id="status"><span class="dot"></span><span>连接检测中…</span></div>
  <div id="authbar" style="display:none;">
    <input id="authtoken" type="password" placeholder="访问令牌（开启鉴权时）" autocomplete="off">
    <button id="authbtn">登录</button>
    <span id="rolebadge"></span>
  </div>
  <div id="simbar" style="display:none;">
    <span>仿真故障场景</span>
    <select id="simselect">
      <option value="flapping">端口 flapping（链路质量）</option>
      <option value="stp_loop">STP 环路（广播风暴）</option>
      <option value="arp_poison">ARP 异常（MAC 冲突）</option>
      <option value="bgp_flap">BGP 邻居抖动</option>
      <option value="acl_deny">ACL 策略拦截</option>
      <option value="dhcp_failure">DHCP 获取失败（地址池耗尽）</option>
      <option value="ospf_neighbor">OSPF 邻居卡 ExStart（MTU 不匹配）</option>
      <option value="link_congestion">上联链路拥塞（时延劣化）</option>
    </select>
    <button id="simswitch" style="height:auto;padding:4px 12px;font-size:12px;border-radius:10px;">切换</button>
    <span class="tip" id="simtip"></span>
    <button id="reportbtn" style="height:auto;padding:4px 12px;font-size:12px;border-radius:10px;" title="把当前会话导出为 HTML 排障报告">导出报告</button>
  </div>
</header>

<main id="main">
  <aside id="sidebar">
    <div class="sb-head">
      <h3>会话历史</h3>
      <button class="sb-new" id="newChatBtn">+ 新建</button>
    </div>
    <div class="sb-list" id="sbList"></div>
  </aside>
  <div id="chat"></div>
  <section id="topo">
    <div class="topo-wrap">
      <div class="topo-head">
        <div>
          <h2>FRR 真实路由拓扑</h2>
          <div class="sub">方案 B · 真实 OSPF/eBGP 协议状态机（Docker 容器栈）· 实时读取</div>
        </div>
        <div class="topo-actions">
          <span class="autorefresh"><input type="checkbox" id="autoRefresh" checked> 自动刷新（5s）</span>
          <button id="topoRefresh">立即刷新</button>
          <button id="topoRecover" style="background:linear-gradient(135deg,#EA6668,#C0392B);" title="一键恢复全部 FRR 故障（演练后兜底，admin）">一键恢复</button>
        </div>
      </div>
      <div class="topo-banner" id="topoBanner" style="display:none;"></div>
      <div id="topo-svg-box"><div class="topo-hint">加载中…</div></div>
      <div class="topo-cards" id="topoCards"></div>
      <div class="tl-box">
        <div class="tl-head"><b>事件时间线</b><span id="tlMeta">最近 30 条 · 实时审计流</span></div>
        <div class="tl-list" id="tlList"><div class="topo-hint">加载中…</div></div>
      </div>
      <div class="topo-hint">节点/链路颜色 = 实时协议状态（绿=正常 · 红=异常 · 灰=未知）；数据来自 frr1-3 容器真实 vtysh 输出</div>
    </div>
  </section>
</main>

<footer>
  <div class="inputbar">
    <textarea id="input" placeholder="描述故障现象，例如：核心交换机 SW-1 的 1/0/1 端口反复 up/down，帮我排查一下…" rows="1"></textarea>
    <button id="send">发送</button>
  </div>
  <div class="hint">Enter 发送 · Shift+Enter 换行 · 模型由后端配置（智谱 GLM）</div>
</footer>

<script>
(function(){
  "use strict";
  var chat = document.getElementById('chat');
  var input = document.getElementById('input');
  var sendBtn = document.getElementById('send');
  var statusBox = document.getElementById('status');
  var history = [];
  var sending = false;

  // ---- 会话持久化（M5 工程化）：刷新/重启后可恢复多轮对话 ----
  var sessionId = localStorage.getItem('netops_sid');
  if(!sessionId){
    sessionId = 's-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
    localStorage.setItem('netops_sid', sessionId);
  }

  // ---- 认证状态 ----
  var authToken = localStorage.getItem('netops_token') || '';
  var authEnabled = false;
  var authbar = document.getElementById('authbar');
  var authtoken = document.getElementById('authtoken');
  var authbtn = document.getElementById('authbtn');
  var rolebadge = document.getElementById('rolebadge');

  function apiFetch(url, opts){
    opts = opts || {};
    var h = Object.assign({}, opts.headers || {});
    if(authToken) h['Authorization'] = 'Bearer ' + authToken;
    opts.headers = h;
    return fetch(url, opts);
  }
  function renderAuth(me){
    authEnabled = !!me.auth_enabled;
    if(!authEnabled){
      authbar.style.display = 'none';
      return;
    }
    authbar.style.display = 'flex';
    // 角色裁剪：仿真场景切换仅 admin 可用
    if(me.authenticated && me.role === 'admin'){ simbar.style.display = 'flex'; }
    else { simbar.style.display = 'none'; }
    if(me.authenticated && me.role){
      authtoken.style.display = 'none';
      authbtn.textContent = '退出';
      rolebadge.textContent = '角色：' + me.role;
      rolebadge.className = me.role;
      rolebadge.style.display = 'inline-block';
    }else{
      authtoken.style.display = 'inline-block';
      authbtn.textContent = '登录';
      rolebadge.textContent = '';
      rolebadge.style.display = 'none';
    }
  }
  authbtn.addEventListener('click', function(){
    if(authToken && authbtn.textContent === '退出'){
      authToken = '';
      localStorage.removeItem('netops_token');
      authbar.style.display = 'none';
      authtoken.style.display = 'inline-block';
      authbtn.textContent = '登录';
      rolebadge.style.display = 'none';
      setStatus('已退出登录（未认证为 viewer）');
      return;
    }
    var tok = authtoken.value.trim();
    if(!tok){ alert('请输入访问令牌'); return; }
    apiFetch('/api/auth/me', {headers:{'Authorization':'Bearer ' + tok}})
      .then(function(r){ return r.json(); })
      .then(function(me){
        if(me.authenticated){
          authToken = tok;
          localStorage.setItem('netops_token', tok);
          renderAuth(me);
          setStatus('已登录 · 角色 ' + me.role);
        }else{
          alert('令牌无效或未配置对应角色');
        }
      })
      .catch(function(e){ alert('登录失败：' + e.message); });
  });

  function el(tag, cls, text){
    var n = document.createElement(tag);
    if(cls) n.className = cls;
    if(text !== undefined) n.textContent = text;
    return n;
  }
  function appendMsg(role, text, isErr){
    var row = el('div', 'msg ' + (role === 'user' ? 'user' : 'bot'));
    row.appendChild(el('div', 'avatar', role === 'user' ? '我' : 'AI'));
    var b = el('div', 'bubble' + (isErr ? ' err' : ''), text);
    row.appendChild(b);
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
    return b;
  }
  function setStatus(html){
    statusBox.innerHTML = '<span class="dot"></span>' + html;
  }

  function addSourcesFooter(bubble, sources){
    var f = document.createElement('div');
    f.style.cssText = 'margin-top:10px;padding-top:8px;border-top:1px solid rgba(53,195,216,.25);font-size:12px;color:#9FB4BD;';

  function parseSSE(res){
    var reader = res.body.getReader();
    var decoder = new TextDecoder();
    var buf = '';
    return (async function(){
      var bubble = null, acc = '', curSources = null, traceBox = null;
      function ensureTrace(){
        if(traceBox) return traceBox;
        var row = el('div', 'msg bot');
        row.appendChild(el('div', 'avatar', 'AI'));
        var box = el('div', 'bubble tracebox');
        box.appendChild(el('div', 'tracetitle', '🔧 工具调用过程'));
        row.appendChild(box);
        chat.appendChild(row);
        chat.scrollTop = chat.scrollHeight;
        traceBox = box;
        return box;
      }
      while(true){
        var r = await reader.read();
        if(r.done) break;
        buf += decoder.decode(r.value, {stream:true});
        var idx;
        while((idx = buf.indexOf('\n\n')) !== -1){
          var block = buf.slice(0, idx);
          buf = buf.slice(idx + 2);
          block.split('\n').forEach(function(line){
            if(!line.startsWith('data: ')) return;
            var data;
            try{ data = JSON.parse(line.slice(6)); }catch(e){ return; }
            if(data.type === 'delta'){
              if(!bubble){ bubble = appendMsg('assistant', ''); }
              acc += data.content;
              bubble.textContent = acc;
              chat.scrollTop = chat.scrollHeight;
            }else if(data.type === 'sources'){
              curSources = data.sources || [];
            }else if(data.type === 'tool'){
              var box = ensureTrace();
              var line = el('div', 'traceline');
              var mark = data.ok ? '<span class="ok">✓</span>' : '<span class="no">✗</span>';
              var args = data.args ? JSON.stringify(data.args) : '';
              var result = (data.result || '').replace(/\n/g, ' ').slice(0, 140);
              line.innerHTML = mark + ' <span class="tk">' + (data.tool||'') + '</span> ' + args + '<br>' + result;
              box.appendChild(line);
              chat.scrollTop = chat.scrollHeight;
            }else if(data.type === 'done'){
              if(!bubble){ bubble = appendMsg('assistant', ''); }
              if(curSources && curSources.length){ addSourcesFooter(bubble, curSources); }
              history.push({role:'assistant', content: acc || '(空回复)'});
            }else if(data.type === 'error'){
              if(!bubble){ bubble = appendMsg('assistant', '', true); }
              bubble.className = 'bubble err';
              bubble.textContent = data.message || '未知错误';
              history.push({role:'assistant', content:'[错误] ' + (data.message||'')});
            }
          });
        }
      }
      if(!bubble){ appendMsg('assistant', '(无输出)'); }
    })();
  }

  function nodeHealth(dev){
    var h = dev.parsed && dev.parsed.healthy;
    var faults = dev.active_faults || {};
    var faultNames = Object.keys(faults);
    if(faultNames.length){
      // link_down / bgp_neighbor_down → 红（链路真断）；ospf_cost → 黄（路由劣化）
      var hardDown = faultNames.some(function(f){ return f === 'link_down' || f === 'bgp_neighbor_down'; });
      return hardDown ? 'bad' : 'warn';
    }
    return h === true ? 'ok' : (h === false ? 'bad' : 'unk');
  }
  function faultBadge(dev){
    var faults = dev.active_faults || {};
    var map = {link_down:'链路中断', ospf_cost:'路由劣化', bgp_neighbor_down:'BGP 会话中断'};
    return Object.keys(faults).map(function(f){ return '⚠ ' + (map[f] || f); }).join(' · ');
  }
  function linkHealth(devs, key){
    // OSPF 链路健康看 frr1/frr2；eBGP 链路看 frr2/frr3
    var names = key === '12' ? ['frr1','frr2'] : ['frr2','frr3'];
    var states = names.map(function(n){ return nodeHealth(devs[n] || {}); });
    if(states.indexOf('bad') !== -1) return 'bad';
    if(states.indexOf('ok') === -1) return 'unk';
    return 'ok';
  }

  function renderTopoSvg(devs){
    var names = Object.keys(devs);
    if(!names.length){
      svgBox.innerHTML = '<div class="topo-hint">无在跑的 FRR 容器（请启动 Docker 并 docker compose up -d）</div>';
      return;
    }
    // 动态布局：N 个节点横向等距排列
    var n = names.length;
    var boxW = 260, boxH = 120, gap = (900 - n*boxW) / (n+1);
    var nodes = names.map(function(name, i){
      return {name: name, x: gap + i*(boxW+gap), y: 80, w: boxW, h: boxH};
    });
    var parts = [];
    parts.push('<svg viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="FRR 真实路由拓扑图">');
    // 链路：相邻节点连虚线
    for(var i=0;i<nodes.length-1;i++){
      var a=nodes[i], b=nodes[i+1];
      var da=devs[a.name], db=devs[b.name];
      var lh = (nodeHealth(da)==='bad' || nodeHealth(db)==='bad') ? 'bad' : 'ok';
      parts.push('<line class="link-line '+lh+'" x1="'+(a.x+a.w)+'" y1="'+(a.y+a.h/2)+'" x2="'+b.x+'" y2="'+(b.y+b.h/2)+'"/>');
    }
    nodes.forEach(function(d){
      var dev = devs[d.name] || {};
      var st = nodeHealth(dev);
      parts.push('<rect class="node-box '+st+'" x="'+d.x+'" y="'+d.y+'" rx="12" ry="12" width="'+d.w+'" height="'+d.h+'"/>');
      parts.push('<text class="node-title" x="'+(d.x+14)+'" y="'+(d.y+30)+'">'+esc(d.name)+'</text>');
      parts.push('<text class="node-role" x="'+(d.x+14)+'" y="'+(d.y+50)+'">'+esc(dev.role||'FRR')+'</text>');
      var info = [];
      var p = dev.parsed;
      if(p && p.ospf_peers && p.ospf_peers.length) info.push('OSPF: ' + p.ospf_peers.map(function(x){ return x.id+' '+x.state; }).join(' / '));
      if(p && p.bgp_peers && p.bgp_peers.length) info.push('eBGP: ' + p.bgp_peers.map(function(x){ return x.peer+'→'+(x.state.match(/^\d+$/)?'Established':x.state); }).join(' / '));
      if(!info.length) info.push(p && p.routes && p.routes.length ? '路由 '+p.routes.length+' 条' : '（无邻居数据）');
      var t = info[0] || ''; if(t.length>34) t=t.slice(0,33)+'…';
      parts.push('<text class="node-sub" x="'+(d.x+14)+'" y="'+(d.y+70)+'">'+esc(t)+'</text>');
      var fb = faultBadge(dev);
      if(fb) parts.push('<text class="node-fault" x="'+(d.x+14)+'" y="'+(d.y+106)+'">'+esc(fb)+'</text>');
    });
    parts.push('</svg>');
    svgBox.innerHTML = parts.join('');
  }

      var active = (s.session_id === sessionId) ? ' active' : '';
      var d = new Date(s.updated * 1000);
      var ts = (d.getMonth()+1) + '/' + d.getDate() + ' ' + ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2);
      var title = esc(s.title || s.session_id.slice(-8));
      return '<div class="sb-item' + active + '" data-sid="' + esc(s.session_id) + '" title="' + esc(title) + '">'
        + '<div style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + esc(title) + '</div>'
        + '<div class="sb-del" data-del="' + esc(s.session_id) + '" title="删除">×</div>'
        + '<div style="font-size:10px;opacity:.6;width:100%;">' + s.messages + ' 条 · ' + ts + '</div></div>';
    }).join('');
    sbList.querySelectorAll('.sb-item').forEach(function(el){
      el.addEventListener('click', function(e){
        if(e.target.classList.contains('sb-del')) return;
        switchSession(el.getAttribute('data-sid'));
      });
    });
    sbList.querySelectorAll('.sb-del').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        var sid = btn.getAttribute('data-del');
        if(btn.dataset.confirming){
          // 第二次点：确认删除
          apiFetch('/api/session/' + encodeURIComponent(sid), {method:'DELETE'}).then(function(){
            refreshSessions();
            if(sid === sessionId){
              clearChatDom();
              appendMsg('bot', '已删除当前会话，点左上角「+ 新建」开始新对话。');
            }
          }).catch(function(e){ alert('删除失败：' + e.message); });
          return;
        }
        // 第一次点：变成确认状态
        btn.dataset.confirming = '1';
        btn.textContent = '✓';
        btn.style.background = '#E57373';
        var cancel = document.createElement('div');
        cancel.className = 'sb-del';
        cancel.textContent = '✗';
        cancel.style.background = '#9FB4BD';
        cancel.addEventListener('click', function(ev){
          ev.stopPropagation();
          renderSessions(currentSessionsCache || []);
        });
        btn.parentNode.insertBefore(cancel, btn.nextSibling);
        // 5 秒后自动还原
        setTimeout(function(){ renderSessions(currentSessionsCache || []); }, 5000);
      });
    });
  }
  var currentSessionsCache = [];

  function refreshSessions(){
    apiFetch('/api/sessions').then(function(r){ return r.json(); }).then(function(d){
      if(d && d.ok) renderSessions(d.sessions || []);
    }).catch(function(){});
  }

  function switchSession(sid){
    if(!sid || sid === sessionId) return;
    sessionId = sid;
    localStorage.setItem('netops_sid', sid);
    clearChatDom();
    apiFetch('/api/session/' + encodeURIComponent(sid)).then(function(r){ return r.json(); }).then(function(d){
      if(d && d.ok && d.messages && d.messages.length){
        d.messages.forEach(function(m){
          history.push({role:m.role, content:m.content});
          appendMsg(m.role, m.content || '(空回复)');
        });
      } else {
        appendMsg('bot', '已切换到新会话。');
      }
      refreshSessions();
    }).catch(function(){ appendMsg('bot', '切换会话失败。'); });
  }

  function clearChatDom(){
    chat.innerHTML = '';
    history.length = 0;
  }

  newChatBtn.addEventListener('click', function(){
    var sid = 's-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
    switchSession(sid);
  });

  refreshSessions();
  setInterval(refreshSessions, 15000);

  // 初始加载拓扑（分栏模式下立即可见）
  loadTopo(true);

  input.focus();
})();
</script>
</body>
</html>
