<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NetOps AI Assistant · 网络运维智能助手</title>
<style>
  :root{
    --bg:#0F2027; --panel:#162B33; --panel2:#1C3640; --line:#2A4652;
    --ink:#E8F1F4; --sub:#9FB4BD; --accent:#35C3D8; --accent2:#1F7A8C;
    --user:#0E7490; --err:#E57373;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'PingFang SC','Microsoft YaHei','Segoe UI',Arial,sans-serif;
    background:linear-gradient(160deg,#0F2027 0%,#122B35 60%,#0F2027 100%);
    color:var(--ink);display:flex;flex-direction:column;height:100vh;
  }
  header{
    padding:12px 20px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    background:rgba(22,43,51,.85);backdrop-filter:blur(4px);
  }
  header .brand{display:flex;align-items:center;gap:10px;}
  .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;color:#fff;}
  header h1{font-size:16px;font-weight:700;}
  header .tag{font-size:12px;color:var(--sub);}
  #status{font-size:12px;color:var(--sub);background:var(--panel2);border:1px solid var(--line);
    padding:4px 12px;border-radius:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  #status .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;}
  #status .mock{color:var(--accent);font-weight:600;}
  main{flex:1;overflow-y:auto;padding:20px 16px;max-width:860px;width:100%;margin:0 auto;}
  .msg{display:flex;gap:10px;margin-bottom:16px;align-items:flex-start;}
  .avatar{flex:0 0 34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    font-size:14px;font-weight:700;color:#fff;}
  .msg.user .avatar{background:var(--user);}
  .msg.bot .avatar{background:linear-gradient(135deg,var(--accent),var(--accent2));}
  .bubble{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;font-size:14px;line-height:1.75;white-space:pre-wrap;word-break:break-word;}
  .msg.user .bubble{background:rgba(14,116,144,.18);border-color:rgba(14,116,144,.4);}
  .bubble.err{border-color:rgba(229,115,115,.5);}
  .bubble.tracebox{background:rgba(53,195,216,.06);border-color:rgba(53,195,216,.28);padding:10px 12px;}
  .tracetitle{font-size:12px;color:var(--accent);font-weight:600;margin-bottom:6px;}
  .traceline{font-size:12px;color:var(--sub);line-height:1.6;padding:2px 0;border-bottom:1px dashed rgba(53,195,216,.12);white-space:pre-wrap;word-break:break-all;}
  .traceline:last-child{border-bottom:none;}
  .traceline .tk{color:var(--accent);font-weight:600;}
  .traceline .ok{color:#7BD88F;} .traceline .no{color:var(--err);}
  .cursor{display:inline-block;width:8px;height:16px;background:var(--accent);vertical-align:-2px;animation:blink 1s steps(2) infinite;margin-left:2px;}
  @keyframes blink{50%{opacity:0;}}
  footer{padding:14px 16px;border-top:1px solid var(--line);background:rgba(22,43,51,.9);}
  .inputbar{max-width:860px;margin:0 auto;display:flex;gap:10px;align-items:flex-end;}
  textarea{flex:1;resize:none;background:var(--panel2);color:var(--ink);border:1px solid var(--line);
    border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.5;min-height:48px;max-height:160px;
    font-family:inherit;outline:none;}
  textarea:focus{border-color:var(--accent);}
  button{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;
    border-radius:12px;padding:0 22px;height:48px;font-size:15px;font-weight:700;cursor:pointer;transition:opacity .15s;}
  button:hover{opacity:.9;} button:disabled{opacity:.4;cursor:not-allowed;}
  .hint{max-width:860px;margin:6px auto 0;font-size:12px;color:var(--sub);text-align:center;}
  .placeholder{text-align:center;color:var(--sub);margin-top:14vh;font-size:14px;}
  .placeholder .big{font-size:18px;color:var(--accent);margin-bottom:10px;}
  .chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px;}
  .chip{font-size:12px;color:var(--sub);background:var(--panel2);border:1px solid var(--line);
    border-radius:14px;padding:5px 12px;cursor:pointer;}
  .chip:hover{border-color:var(--accent);color:var(--ink);}
  #simbar{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--sub);flex-wrap:wrap;}
  #simbar select{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:10px;
    padding:4px 8px;font-size:12px;outline:none;cursor:pointer;}
  #simbar select:focus{border-color:var(--accent);}
  #simbar .tip{color:var(--sub);font-size:11px;}
  #authbar{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--sub);flex-wrap:wrap;}
  #authbar input{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:10px;
    padding:5px 10px;font-size:12px;width:150px;outline:none;}
  #authbar input:focus{border-color:var(--accent);}
  #authbar button{height:auto;padding:5px 14px;font-size:12px;border-radius:10px;}
  #rolebadge{font-size:11px;padding:3px 10px;border-radius:12px;border:1px solid var(--line);color:var(--sub);}
  #rolebadge.admin{color:#7BD88F;border-color:rgba(123,216,143,.4);}
  #rolebadge.operator{color:var(--accent);border-color:rgba(53,195,216,.4);}
  #rolebadge.viewer{color:#F4B393;border-color:rgba(244,179,147,.4);}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">N</div>
    <div>
      <h1>NetOps AI Assistant</h1>
      <div class="tag">网络运维智能助手 · 智谱 GLM</div>
    </div>
  </div>
  <div id="status"><span class="dot"></span><span>连接检测中…</span></div>
  <div id="authbar" style="display:none;">
    <input id="authtoken" type="password" placeholder="访问令牌（开启鉴权时）" autocomplete="off">
    <button id="authbtn">登录</button>
    <span id="rolebadge"></span>
  </div>
  <div id="simbar" style="display:none;">
    <span>仿真故障场景</span>
    <select id="simselect">
      <option value="flapping">端口 flapping（链路质量）</option>
      <option value="stp_loop">STP 环路（广播风暴）</option>
      <option value="arp_poison">ARP 异常（MAC 冲突）</option>
      <option value="bgp_flap">BGP 邻居抖动</option>
      <option value="acl_deny">ACL 策略拦截</option>
    </select>
    <button id="simswitch" style="height:auto;padding:4px 12px;font-size:12px;border-radius:10px;">切换</button>
    <span class="tip" id="simtip"></span>
  </div>
</header>

<main id="chat"></main>

<footer>
  <div class="inputbar">
    <textarea id="input" placeholder="描述故障现象，例如：核心交换机 SW-1 的 1/0/1 端口反复 up/down，帮我排查一下…" rows="1"></textarea>
    <button id="send">发送</button>
  </div>
  <div class="hint">Enter 发送 · Shift+Enter 换行 · 模型由后端配置（智谱 GLM）</div>
</footer>

<script>
(function(){
  "use strict";
  var chat = document.getElementById('chat');
  var input = document.getElementById('input');
  var sendBtn = document.getElementById('send');
  var statusBox = document.getElementById('status');
  var history = [];
  var sending = false;

  // ---- 认证状态 ----
  var authToken = localStorage.getItem('netops_token') || '';
  var authEnabled = false;
  var authbar = document.getElementById('authbar');
  var authtoken = document.getElementById('authtoken');
  var authbtn = document.getElementById('authbtn');
  var rolebadge = document.getElementById('rolebadge');

  function apiFetch(url, opts){
    opts = opts || {};
    var h = Object.assign({}, opts.headers || {});
    if(authToken) h['Authorization'] = 'Bearer ' + authToken;
    opts.headers = h;
    return fetch(url, opts);
  }
  function renderAuth(me){
    authEnabled = !!me.auth_enabled;
    if(!authEnabled){
      authbar.style.display = 'none';
      return;
    }
    authbar.style.display = 'flex';
    // 角色裁剪：仿真场景切换仅 admin 可用
    if(me.authenticated && me.role === 'admin'){ simbar.style.display = 'flex'; }
    else { simbar.style.display = 'none'; }
    if(me.authenticated && me.role){
      authtoken.style.display = 'none';
      authbtn.textContent = '退出';
      rolebadge.textContent = '角色：' + me.role;
      rolebadge.className = me.role;
      rolebadge.style.display = 'inline-block';
    }else{
      authtoken.style.display = 'inline-block';
      authbtn.textContent = '登录';
      rolebadge.textContent = '';
      rolebadge.style.display = 'none';
    }
  }
  authbtn.addEventListener('click', function(){
    if(authToken && authbtn.textContent === '退出'){
      authToken = '';
      localStorage.removeItem('netops_token');
      authbar.style.display = 'none';
      authtoken.style.display = 'inline-block';
      authbtn.textContent = '登录';
      rolebadge.style.display = 'none';
      setStatus('已退出登录（未认证为 viewer）');
      return;
    }
    var tok = authtoken.value.trim();
    if(!tok){ alert('请输入访问令牌'); return; }
    apiFetch('/api/auth/me', {headers:{'Authorization':'Bearer ' + tok}})
      .then(function(r){ return r.json(); })
      .then(function(me){
        if(me.authenticated){
          authToken = tok;
          localStorage.setItem('netops_token', tok);
          renderAuth(me);
          setStatus('已登录 · 角色 ' + me.role);
        }else{
          alert('令牌无效或未配置对应角色');
        }
      })
      .catch(function(e){ alert('登录失败：' + e.message); });
  });

  function el(tag, cls, text){
    var n = document.createElement(tag);
    if(cls) n.className = cls;
    if(text !== undefined) n.textContent = text;
    return n;
  }
  function appendMsg(role, text, isErr){
    var row = el('div', 'msg ' + (role === 'user' ? 'user' : 'bot'));
    row.appendChild(el('div', 'avatar', role === 'user' ? '我' : 'AI'));
    var b = el('div', 'bubble' + (isErr ? ' err' : ''), text);
    row.appendChild(b);
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
    return b;
  }
  function setStatus(html){
    statusBox.innerHTML = '<span class="dot"></span>' + html;
  }

  function addSourcesFooter(bubble, sources){
    var f = document.createElement('div');
    f.style.cssText = 'margin-top:10px;padding-top:8px;border-top:1px solid rgba(53,195,216,.25);font-size:12px;color:#9FB4BD;';
    f.textContent = '📎 参考来源：' + sources.map(function(s){ return s.source + ' (' + Math.round((s.score||0)*100) + '%)'; }).join(' · ');
    bubble.appendChild(f);
  }

  function parseSSE(res){
    var reader = res.body.getReader();
    var decoder = new TextDecoder();
    var buf = '';
    return (async function(){
      var bubble = null, acc = '', curSources = null, traceBox = null;
      function ensureTrace(){
        if(traceBox) return traceBox;
        var row = el('div', 'msg bot');
        row.appendChild(el('div', 'avatar', 'AI'));
        var box = el('div', 'bubble tracebox');
        box.appendChild(el('div', 'tracetitle', '🔧 工具调用过程'));
        row.appendChild(box);
        chat.appendChild(row);
        chat.scrollTop = chat.scrollHeight;
        traceBox = box;
        return box;
      }
      while(true){
        var r = await reader.read();
        if(r.done) break;
        buf += decoder.decode(r.value, {stream:true});
        var idx;
        while((idx = buf.indexOf('\n\n')) !== -1){
          var block = buf.slice(0, idx);
          buf = buf.slice(idx + 2);
          block.split('\n').forEach(function(line){
            if(!line.startsWith('data: ')) return;
            var data;
            try{ data = JSON.parse(line.slice(6)); }catch(e){ return; }
            if(data.type === 'delta'){
              if(!bubble){ bubble = appendMsg('assistant', ''); }
              acc += data.content;
              bubble.textContent = acc;
              chat.scrollTop = chat.scrollHeight;
            }else if(data.type === 'sources'){
              curSources = data.sources || [];
            }else if(data.type === 'tool'){
              var box = ensureTrace();
              var line = el('div', 'traceline');
              var mark = data.ok ? '<span class="ok">✓</span>' : '<span class="no">✗</span>';
              var args = data.args ? JSON.stringify(data.args) : '';
              var result = (data.result || '').replace(/\n/g, ' ').slice(0, 140);
              line.innerHTML = mark + ' <span class="tk">' + (data.tool||'') + '</span> ' + args + '<br>' + result;
              box.appendChild(line);
              chat.scrollTop = chat.scrollHeight;
            }else if(data.type === 'done'){
              if(!bubble){ bubble = appendMsg('assistant', ''); }
              if(curSources && curSources.length){ addSourcesFooter(bubble, curSources); }
              history.push({role:'assistant', content: acc || '(空回复)'});
            }else if(data.type === 'error'){
              if(!bubble){ bubble = appendMsg('assistant', '', true); }
              bubble.className = 'bubble err';
              bubble.textContent = data.message || '未知错误';
              history.push({role:'assistant', content:'[错误] ' + (data.message||'')});
            }
          });
        }
      }
      if(!bubble){ appendMsg('assistant', '(无输出)'); }
    })();
  }

  async function send(){
    if(sending) return;
    var text = input.value.trim();
    if(!text) return;
    input.value = '';
    input.style.height = 'auto';
    appendMsg('user', text);
    history.push({role:'user', content:text});
    sending = true;
    sendBtn.disabled = true;
    try{
      var res = await apiFetch('/api/chat', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({message:text, history: history.slice(0, -1)})
      });
      if(!res.ok || !res.body){ throw new Error('请求失败 HTTP ' + res.status + (res.status === 403 ? '（权限不足）' : '')); }
      await parseSSE(res);
    }catch(e){
      appendMsg('assistant', '连接失败：' + e.message, true);
    }finally{
      sending = false;
      sendBtn.disabled = false;
      input.focus();
    }
  }

  function autoResize(){
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 160) + 'px';
  }

  input.addEventListener('input', autoResize);
  input.addEventListener('keydown', function(e){
    if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }
  });
  sendBtn.addEventListener('click', send);

  function addChips(){
    if(history.length > 0) return;
    var ph = el('div', 'placeholder');
    ph.innerHTML = '<div class="big">网络运维智能助手</div>输入故障现象，助手将检索知识库并给出排查建议。';
    var chips = el('div', 'chips');
    ['端口 flapping 怎么排查？','如何查看交换机接口收发光功率？','OSPF 邻居状态一直 DOWN 怎么办？','从 core-sw-1 检查到 10.0.1.2 的连通性并排查 OSPF 邻居问题'].forEach(function(t){
      var c = el('span', 'chip', t);
      c.addEventListener('click', function(){ input.value = t; send(); });
      chips.appendChild(c);
    });
    ph.appendChild(chips);
    chat.appendChild(ph);
  }

  // ---- 仿真故障场景切换 ----
  var SCENARIO_QUESTIONS = {
    flapping: '从 core-sw-1 检查到 10.0.1.2 的连通性并排查 OSPF 邻居问题',
    stp_loop: 'core-sw-1 的 CPU 占用率很高，接口 GE0/0/1 和 GE0/0/2 收发速率异常，网络时通时断，帮我排查是否环路',
    arp_poison: '核心交换机上 10.0.1.2 经常 ping 不通，接口都是 up 的，帮我排查 ARP 问题',
    bgp_flap: 'core-rtr-1 的 BGP 邻居 10.0.1.1 一直处于 Active 状态，帮我排查原因',
    acl_deny: '从 core-sw-1 ping 10.0.1.2 全部超时但接口是 up 的，怀疑被 ACL 拦截，帮我确认并给出处置'
  };
  var simbar = document.getElementById('simbar');
  var simselect = document.getElementById('simselect');
  var simswitch = document.getElementById('simswitch');
  var simtip = document.getElementById('simtip');
  function setSimTip(name){
    simtip.textContent = SCENARIO_QUESTIONS[name] ? '示例问题：' + SCENARIO_QUESTIONS[name] : '';
  }
  simswitch.addEventListener('click', function(){
    var name = simselect.value;
    apiFetch('/api/sim/scenario', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({scenario: name})
    }).then(function(r){ return r.json(); }).then(function(d){
      if(d.ok){ setSimTip(d.scenario); simselect.value = d.scenario; }
      else{ alert('切换失败：' + (d.message || '未知错误')); }
    }).catch(function(e){ alert('切换失败：' + e.message); });
  });

  apiFetch('/api/health').then(function(r){ return r.json(); }).then(function(d){
    var model = d.model || '-';
    if(d.mock){ setStatus('模拟模式（未配置 API Key） · 模型 ' + model + ' · <span class="mock">LLM_MOCK=true</span>'); }
    else{ setStatus('智谱 GLM 已连接 · 模型 ' + model + (d.key_configured ? '' : ' · Key 未配置')); }
    if(d.device_mode === 'simulate' && d.sim_scenario){
      simbar.style.display = 'flex';
      simselect.value = d.sim_scenario;
      setSimTip(d.sim_scenario);
    }
    addChips();
    // 认证状态与角色裁剪
    apiFetch('/api/auth/me').then(function(r){ return r.json(); }).then(function(me){
      renderAuth(me);
    }).catch(function(){});
  }).catch(function(){ setStatus('后端未连接（请先启动 uvicorn）'); });

  input.focus();
})();
</script>
</body>
</html>
