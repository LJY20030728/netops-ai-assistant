# frr1：OSPF 一侧（router-id 1.1.1.1），与 frr2 在 10.0.12.0/29 建邻
# 接口：容器仅连接 net12 → eth0（Docker 静态 IP 10.0.12.2/29）
frr version 9.0
frr defaults traditional
hostname frr1
log stdout
!
interface eth0
 ip address 10.0.12.2/29
!
interface lo
 ip address 1.1.1.1/32
!
router ospf
 ospf router-id 1.1.1.1
 passive-interface lo
 network 10.0.12.0/29 area 0
!
line vty
