# frr3：eBGP 一侧（AS 65003，router-id 3.3.3.3），与 frr2 在 10.0.23.0/29 建邻
# 接口：容器仅连接 net23 → eth0（Docker 静态 IP 10.0.23.3/29）
frr version 9.0
frr defaults traditional
hostname frr3
log stdout
!
interface eth0
 ip address 10.0.23.3/29
!
interface lo
 ip address 3.3.3.3/32
!
# FRR 10.x 强制 eBGP 出站策略
route-map PERMIT_ALL permit 10
!
router bgp 65003
 bgp router-id 3.3.3.3
 neighbor 10.0.23.2 remote-as 65002
 neighbor 10.0.23.2 ebgp-multihop 2
 address-family ipv4 unicast
  neighbor 10.0.23.2 activate
  neighbor 10.0.23.2 route-map PERMIT_ALL in
  neighbor 10.0.23.2 route-map PERMIT_ALL out
  network 10.0.23.0/29
  network 3.3.3.3/32
 exit-address-family
!
line vty
