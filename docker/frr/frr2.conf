# frr2：OSPF（10.0.12.0/29，router-id 2.2.2.2）+ eBGP（AS 65002，对 frr3 AS 65003）
# 接口：容器连接 net12 → eth0（10.0.12.3/29）、net23 → eth1（10.0.23.2/29）
frr version 9.0
frr defaults traditional
hostname frr2
log stdout
!
interface eth0
 ip address 10.0.12.3/29
!
interface eth1
 ip address 10.0.23.2/29
!
interface lo
 ip address 2.2.2.2/32
!
router ospf
 ospf router-id 2.2.2.2
 passive-interface eth1
 network 10.0.12.0/29 area 0
 network 10.0.23.0/29 area 0
 network 2.2.2.2/32 area 0
!
# FRR 10.x 强制 eBGP 出站策略：不配置则拒绝发送 UPDATE（EBGP outbound policy not properly setup）
route-map PERMIT_ALL permit 10
!
router bgp 65002
 bgp router-id 2.2.2.2
 neighbor 10.0.23.3 remote-as 65003
 neighbor 10.0.23.3 ebgp-multihop 2
 address-family ipv4 unicast
  neighbor 10.0.23.3 activate
  neighbor 10.0.23.3 next-hop-self
  neighbor 10.0.23.3 route-map PERMIT_ALL in
  neighbor 10.0.23.3 route-map PERMIT_ALL out
  network 10.0.12.0/29
  network 2.2.2.2/32
 exit-address-family
!
line vty
